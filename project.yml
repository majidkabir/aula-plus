name: AulaPlus
options:
  bundleIdPrefix: com.majidkabir
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AulaPlus:
    type: application
    platform: iOS
    sources:
      - AulaPlus
      - Shared
    dependencies:
      - target: AulaPlusWidget
    entitlements:
      path: AulaPlus/AulaPlus.entitlements
      properties:
        com.apple.security.application-groups: [group.com.majidkabir.aulaplus]
    info:
      path: AulaPlus/Info.plist
      properties:
        CFBundleDisplayName: Aula+
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Aula+ kan låses med Face ID, så andre ikke kan læse beskeder om dine børn.
        NSPhotoLibraryAddUsageDescription: Aula+ gemmer billeder og videoer fra galleriet i dine Fotos.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.majidkabir.aulaplus.refresh]
        CFBundleDevelopmentRegion: da
        CFBundleLocalizations: [da, en]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majidkabir.aulaplus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  AulaPlusWidget:
    type: app-extension
    platform: iOS
    sources:
      - AulaPlusWidget
      - Shared
    entitlements:
      path: AulaPlusWidget/AulaPlusWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.majidkabir.aulaplus]
    info:
      path: AulaPlusWidget/Info.plist
      properties:
        CFBundleDisplayName: Aula+
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majidkabir.aulaplus.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  AulaPlusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AulaPlusTests
    dependencies:
      - target: AulaPlus
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.majidkabir.aulaplus.tests
schemes:
  AulaPlus:
    build:
      targets:
        AulaPlus: all
        AulaPlusTests: [test]
    test:
      targets:
        - AulaPlusTests
