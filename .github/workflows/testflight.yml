name: TestFlight

# Builds a signed Aula+ and uploads it to TestFlight.
# Run it from GitHub: Actions → TestFlight → Run workflow. Setup: TESTFLIGHT.md.

on:
  workflow_dispatch:
    inputs:
      revoke_old_ci_certs:
        description: "First revoke old development certificates made by earlier CI runs (named 'Created via API')"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=0
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!s}" ]; then echo "::error::Missing repository secret $s (see TESTFLIGHT.md)"; missing=1; fi
          done
          exit $missing

      - name: Xcode version
        # App Store Connect only accepts builds made with Xcode 26 or later.
        run: xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write API key
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          head -1 "$RUNNER_TEMP/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY" \
            || { echo "::error::ASC_KEY_P8 is not the base64 of the .p8 file"; exit 1; }

      # Each runner is new, so Xcode makes a fresh development certificate every run. Apple allows only a
      # few, so remember which exist now and revoke the ones this run created at the end.
      - name: Note existing certificates
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          if [ "${{ inputs.revoke_old_ci_certs }}" = "true" ]; then python3 .github/scripts/asc_certs.py revoke-ci; fi
          python3 .github/scripts/asc_certs.py list > "$RUNNER_TEMP/certs-before.txt"
          echo "Certificates before: $(wc -l < "$RUNNER_TEMP/certs-before.txt")"

      - name: Archive (signed by Xcode with the API key)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project AulaPlus.xcodeproj \
            -scheme AulaPlus \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AulaPlus.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee archive.log | grep -E "error:|\*\* ARCHIVE" || true
          grep -q "\*\* ARCHIVE SUCCEEDED \*\*" archive.log

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AulaPlus.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log | grep -E "error:|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" export.log
          echo "Uploaded build $BUILD_NUMBER. It shows up in App Store Connect → TestFlight after Apple processes it (5–20 min)."

      - name: Revoke certificates this run created
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/certs-before.txt" ] || exit 0
          python3 .github/scripts/asc_certs.py revoke-new "$RUNNER_TEMP/certs-before.txt" || true

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
